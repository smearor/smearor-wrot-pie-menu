[package]
name = "smearor-wrot-pie-menu"
version = "0.1.0"
description = "GTK4 pie menu widget with touch gesture activation for circular menu selection"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/smearor/smearor-wrot-pie-menu"
homepage = "https://smearor.io/"
rust-version = "1.92.0"

[dependencies]
atomic_float = "1.1.0"
dashmap = "6"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_20"] }
gtk4-layer-shell = { version = "0.8.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
typed-builder = "0.23.2"

[features]
default = ["layer-shell"]
layer-shell = ["dep:gtk4-layer-shell"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(fn_traits)', 'cfg(unboxed_closures)', 'cfg(feature, values("layer-shell"))'] }

[workspace.lints.clippy]
non_std_lazy_statics = "warn"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

#
